<!doctype html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/u.svg" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#0f172a" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="color-scheme" content="light dark" />
    <title>UniPlanner — Il Tuo Percorso Accademico</title>

    <!-- Tipografia Accademica d'Autore: Newsreader (Serif Editoriale) + Plus Jakarta Sans + JetBrains Mono -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;0,6..72,700;1,6..72,400;1,6..72,600&family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />

    <!-- Preconnect Backend Ngrok -->
    <link rel="preconnect" href="https://shabby-myself-gleeful.ngrok-free.dev" crossorigin />
    <link rel="dns-prefetch" href="https://shabby-myself-gleeful.ngrok-free.dev" />
    <link rel="dns-prefetch" href="https://vercel.com" />

    <!-- Anti-FOUC: applica il tema e palette salvati prima che React si monti -->
    <script>
      (function() {
        const savedTheme = localStorage.getItem('uniplanner_theme') || 'dark';
        const savedPalette = localStorage.getItem('uniplanner_palette') || 'default';
        document.documentElement.setAttribute('data-theme', savedTheme);
        document.documentElement.setAttribute('data-palette', savedPalette);
        document.documentElement.style.colorScheme = savedTheme;
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
